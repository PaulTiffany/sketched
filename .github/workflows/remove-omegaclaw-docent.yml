name: Remove OmegaClaw docent

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-omegaclaw-docent.yml"

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove OmegaClaw implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          shutil.rmtree("omegaclaw-space", ignore_errors=True)

          for path in (
              Path(".github/workflows/deploy-omegaclaw-space.yml"),
              Path("docs/omegaclaw-runtime.js"),
              Path(".github/workflows/remove-omegaclaw-docent.yml"),
          ):
              path.unlink(missing_ok=True)

          forbidden = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              lower_path = str(path).lower()
              if "omegaclaw-space" in lower_path or path.name == "omegaclaw-runtime.js" or path.name == "deploy-omegaclaw-space.yml":
                  forbidden.append(str(path))
          if forbidden:
              raise SystemExit("OmegaClaw implementation files remain: " + ", ".join(forbidden))
          PY

      - name: Commit removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove the OmegaClaw docent implementation"
          git push
